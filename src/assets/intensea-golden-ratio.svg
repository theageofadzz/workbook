<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" fill="none">
  <title>Intensea Logo 黄金比例研究</title>
  <desc>保留 Intensea 原始轮廓，以圆形、切线和半径按黄金比例递进的辅助圆，研究曲线、负空间与方形落点。</desc>
  <defs>
    <path id="intensea-mark" d="M2 72A70 70 0 0 1 72 2H122V23A49 49 0 0 0 73 72H52A70 70 0 0 1 72 23A49 49 0 0 0 23 72ZM101 51H122V72H101Z"/>
  </defs>
  <rect width="960" height="960" fill="#fafafa"/>

  <g fill="#404040" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="52" y="61">INTENSEA</text>
    <text x="52" y="82" fill="#858585" font-size="10">LOGO / GEOMETRIC STUDY</text>
    <text x="908" y="61" text-anchor="end">GOLDEN RATIO</text>
    <text x="908" y="82" text-anchor="end" fill="#858585" font-size="10">1 : 1.618 : 2.618</text>
  </g>

  <use href="#intensea-mark" transform="translate(176 307) scale(3.2)" fill="#000" opacity=".23"/>

  <!-- The large circles follow the existing arcs; the smaller radii form a phi series. -->
  <g stroke="#8c8c8c" stroke-width=".85">
    <circle cx="406.4" cy="537.4" r="224"/>
    <circle cx="566.4" cy="537.4" r="224"/>
    <circle cx="406.4" cy="537.4" r="156.8"/>
    <circle cx="566.4" cy="537.4" r="156.8"/>
  </g>
  <g stroke="#9b9b9b" stroke-width=".75">
    <circle cx="406.4" cy="537.4" r="138.44"/>
    <circle cx="566.4" cy="537.4" r="85.56"/>
    <circle cx="532.8" cy="503.8" r="52.88"/>
    <circle cx="532.8" cy="503.8" r="32.68"/>
  </g>

  <g stroke="#b0b0b0" stroke-width=".7">
    <path d="M151 313.4H818M151 380.6H818M151 537.4H818"/>
    <path d="M182.4 286V795M406.4 286V795M566.4 286V795"/>
    <path d="M499.2 449.4V568M575 470.2H480"/>
  </g>
  <g stroke="#737373" stroke-width=".75">
    <path d="M398.4 537.4H414.4M406.4 529.4V545.4"/>
    <path d="M558.4 537.4H574.4M566.4 529.4V545.4"/>
    <path d="M526.8 503.8H538.8M532.8 497.8V509.8"/>
  </g>

  <g stroke="#a3a3a3" stroke-width=".75">
    <path d="M182.4 257H406.4M182.4 251V263M406.4 251V263"/>
    <path d="M406.4 257H544.84M544.84 251V263"/>
    <path d="M544.84 257H630.4M630.4 251V263"/>
    <path d="M641.4 700.5L713 793H811"/>
  </g>
  <g fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="11">
    <text x="294.4" y="243" text-anchor="middle">R</text>
    <text x="475.62" y="243" text-anchor="middle">R / &#966;</text>
    <text x="587.62" y="243" text-anchor="middle">R / &#966;&#178;</text>
    <text x="811" y="814" text-anchor="end">&#966; = (1 + &#8730;5) / 2</text>
  </g>

  <path d="M52 872H908" stroke="#dedede" stroke-width=".75"/>
  <g fill="#858585" font-family="Arial, Helvetica, sans-serif" font-size="10">
    <text x="52" y="903">CURVE / SPACE / BALANCE</text>
    <text x="52" y="923">A PROPORTION STUDY OF THE ORIGINAL MARK</text>
  </g>
  <use href="#intensea-mark" transform="translate(860 895) scale(.3871)" fill="#000" opacity=".85"/>
</svg>
