<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{browserTitle}}</title>
  <meta name="description" content="theageofadzz 的文字与片段，来自 centurypaw 的个人随笔、阅读记录与设计思考。">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" href="{{favicon}}" type="image/png">
  <link rel="stylesheet" href="{{base}}/workbook.css">
  <link rel="stylesheet" href="{{base}}/crafts.css?v={{cssVersion}}">
  <script src="{{base}}/crafts.js?v={{jsVersion}}" defer></script>
</head>
<body class="writing-page">
  <main class="writing-main">
    <header class="writing-heading">
      <h1>Crafts</h1>
    </header>
    <div class="crafts-gallery" data-gallery>{{articles}}</div>
    <noscript><p>请启用 JavaScript 以打开文章阅读窗口。</p></noscript>
  </main>

  <nav class="writing-dock" aria-label="主要导航">
    <div class="writing-dock-track" data-dock-track>
      <a href="{{base}}/" data-role="footer-item" data-tooltip="文章首页" aria-label="文章首页"><span class="writing-dock-item"><span class="writing-dock-icon"><img src="{{logo}}" width="20" height="20" alt=""></span></span></a>
      <a href="{{base}}/crafts/" data-role="footer-item" data-tooltip="作品" aria-label="作品" aria-current="page"><span class="writing-dock-item"><span class="writing-dock-icon">{{icon:drafting-compass}}</span></span></a>
      <span class="writing-dock-separator" aria-hidden="true"></span>
      <a href="https://github.com/theageofadzz" data-role="footer-item" data-tooltip="GitHub 个人主页" aria-label="GitHub 个人主页" target="_blank" rel="noopener noreferrer"><span class="writing-dock-item"><span class="writing-dock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="writing-github-icon"><path d="M9 19c-4.3 1.3-4.3-2.2-6-2.7M15 22v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.8A5.3 5.3 0 0 0 18.7 5a5 5 0 0 0-.1-3.6S17.4 1 15 2.8a13.4 13.4 0 0 0-6 0C6.6 1 5.4 1.4 5.4 1.4A5 5 0 0 0 5.3 5a5.3 5.3 0 0 0-1.5 3.7c0 5.3 3.1 6.5 6.1 6.8A3.4 3.4 0 0 0 9 18.1V22"/></svg></span></span></a>
      <a href="{{base}}/about/" data-role="footer-item" data-tooltip="关于 theageofadzz" aria-label="关于 theageofadzz"><span class="writing-dock-item"><span class="writing-dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 6.39A9.97 9.97 0 0 0 17.42 10c.78 0 1.53-.09 2.25-.26c.21.71.33 1.47.33 2.26c0 4.41-3.59 8-8 8c-3 0-5.61-1.66-7-4.11L6.75 14v-1A1.25 1.25 0 0 1 8 11.75A1.25 1.25 0 0 1 9.25 13v1H12m4-2.25A1.25 1.25 0 0 0 14.75 13A1.25 1.25 0 0 0 16 14.25A1.25 1.25 0 0 0 17.25 13A1.25 1.25 0 0 0 16 11.75"/></svg></span></span></a>
    </div>
  </nav>
  <div class="writing-dock-backdrop" aria-hidden="true"></div>

  <dialog class="reading-window" data-reader aria-labelledby="reader-title">
    <button class="writing-icon-button reading-close" type="button" data-close-reader aria-label="关闭阅读窗口" title="关闭阅读窗口" autofocus>{{icon:x}}</button>
    <div class="reading-scroll" data-reader-scroll tabindex="0" aria-label="文章正文">
      <article class="reading-article preview-article">
        <header>
          <p class="preview-date"><time data-reader-date></time></p>
          <h2 class="preview-title" id="reader-title"></h2>
          <p class="preview-subtitle" data-reader-subtitle></p>
        </header>
        <img class="preview-cover" data-reader-cover alt="" hidden>
        <div class="reading-body preview-body" data-reader-body></div>
        <div class="preview-end" aria-hidden="true">· · ·</div>
      </article>
    </div>
  </dialog>
  <script type="application/json" id="crafts-content">{{data}}</script>
</body>
</html>
