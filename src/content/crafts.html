<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{browserTitle}}</title>
  <meta name="description" content="theageofadzz 的文字与片段，来自 centurypaw 的个人随笔、阅读记录与设计思考。">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" href="{{favicon}}" type="image/png">
  <link rel="stylesheet" href="{{base}}/workbook.css">
  <link rel="stylesheet" href="{{base}}/crafts.css?v={{cssVersion}}">
  <script src="{{base}}/crafts.js?v={{jsVersion}}" defer></script>
</head>
<body class="writing-page">
  <main class="writing-main">
    <header class="writing-heading">
      <h1>Crafts</h1>
    </header>
    <div class="crafts-gallery" data-gallery>{{articles}}</div>
    <noscript><p>请启用 JavaScript 以打开文章阅读窗口。</p></noscript>
  </main>

  <nav class="writing-dock" aria-label="主要导航">
    <a href="{{base}}/" data-role="footer-item" data-tooltip="文章首页" aria-label="文章首页"><img src="{{logo}}" width="22" height="16" alt=""></a>
    <a href="{{base}}/crafts/" data-role="footer-item" data-tooltip="作品" aria-label="作品" aria-current="page">{{icon:drafting-compass}}</a>
    <span class="writing-dock-separator" aria-hidden="true"></span>
    <a href="https://github.com/theageofadzz" data-role="footer-item" data-tooltip="GitHub 个人主页" aria-label="GitHub 个人主页" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.2-6-2.7M15 22v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.8A5.3 5.3 0 0 0 18.7 5a5 5 0 0 0-.1-3.6S17.4 1 15 2.8a13.4 13.4 0 0 0-6 0C6.6 1 5.4 1.4 5.4 1.4A5 5 0 0 0 5.3 5a5.3 5.3 0 0 0-1.5 3.7c0 5.3 3.1 6.5 6.1 6.8A3.4 3.4 0 0 0 9 18.1V22"/></svg></a>
    <a href="{{base}}/about/" data-role="footer-item" data-tooltip="关于 theageofadzz" aria-label="关于 theageofadzz">{{icon:circle-user-round}}</a>
  </nav>

  <dialog class="reading-window" data-reader aria-labelledby="reader-title">
    <div class="reading-toolbar">
      <span class="reading-window-brand"><img src="{{logo}}" width="22" height="16" alt=""><span>theageofadzz<span class="reading-toolbar-divider">/</span><span data-reader-category>文字</span></span></span>
      <div class="reading-tools">
        <button class="writing-icon-button" type="button" data-toggle-toc aria-label="文章目录" title="文章目录" aria-expanded="false" aria-controls="reader-toc" hidden>{{icon:list}}</button>
        <div class="reading-font-tools" role="group" aria-label="阅读字号">
          <button class="writing-icon-button" type="button" data-font-step="-1" aria-label="缩小字号" title="缩小字号">{{icon:minus}}</button>
          <output class="reading-font-value" data-font-value aria-label="当前字号">17</output>
          <button class="writing-icon-button" type="button" data-font-step="1" aria-label="放大字号" title="放大字号">{{icon:plus}}</button>
        </div>
        <button class="writing-icon-button" type="button" data-share-article aria-label="复制文章链接" title="复制文章链接">{{icon:link}}</button>
        <span class="reading-toolbar-rule" aria-hidden="true"></span>
        <button class="writing-icon-button reading-close" type="button" data-close-reader aria-label="关闭阅读窗口" title="关闭阅读窗口" autofocus>{{icon:x}}</button>
      </div>
    </div>
    <div class="reading-layout">
      <nav id="reader-toc" class="reading-toc" aria-label="文章目录" hidden></nav>
      <div class="reading-scroll" data-reader-scroll tabindex="0" aria-label="文章正文">
        <article class="reading-article">
          <header class="reading-header">
            <p class="reading-article-meta"><time data-reader-date></time><span aria-hidden="true">/</span><span data-reader-minutes></span></p>
            <h2 id="reader-title"></h2>
            <p class="reading-deck" data-reader-subtitle></p>
            <div class="reading-byline"><img src="{{base}}/assets/cicada-avatar.webp" width="25" height="25" alt=""><span>theageofadzz.</span><span class="reading-original">centurypaw 原文</span></div>
          </header>
          <div class="reading-body" data-reader-body></div>
          <footer class="reading-end">
            <div class="reading-end-mark" aria-hidden="true">· · ·</div>
            <div class="reading-pagination">
              <button type="button" data-reader-previous><span>{{icon:arrow-left}} 上一篇</span><strong></strong></button>
              <button type="button" data-reader-next><span>下一篇 {{icon:arrow-right}}</span><strong></strong></button>
            </div>
          </footer>
        </article>
      </div>
    </div>
    <footer class="reading-statusbar"><span data-reader-status role="status" aria-live="polite">centurypaw / 文字存档</span><span data-reader-percent>0%</span></footer>
    <progress class="reading-progress" data-reader-progress aria-label="阅读进度" max="100" value="0"></progress>
  </dialog>
  <script type="application/json" id="crafts-content">{{data}}</script>
</body>
</html>
