<div class="gamestation-cover" role="img" aria-label="圆形网格中的悬浮电脑与独立键盘，屏幕循环演示浏览 GameStation 游戏列表、打开光盘盒并返回首页">
  <div class="gamestation-computer" aria-hidden="true">
    <div class="gamestation-monitor">
      <div class="gamestation-browser-bar">
        <span class="gamestation-browser-dots"><i></i><i></i><i></i></span>
        <span class="gamestation-browser-address">gamestation.cc</span>
        <span class="gamestation-browser-menu"><i></i><i></i></span>
      </div>
      <div class="gamestation-screen">
        <img class="gamestation-screen-page" src="{{base}}/assets/gamestation-browse.webp" width="960" height="1230" alt="" loading="lazy" decoding="async">
        <img class="gamestation-screen-detail" src="{{base}}/assets/gamestation-open-case.webp" width="1280" height="720" alt="" loading="lazy" decoding="async">
        <div class="gamestation-screen-scrollbar"><span></span></div>
        <div class="gamestation-screen-cursor">
          <span class="gamestation-click-ring"></span>
          {{cursor}}
        </div>
      </div>
    </div>
    <div class="gamestation-keyboard"></div>
  </div>
</div>
