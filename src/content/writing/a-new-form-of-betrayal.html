<p> 我还想念我最初的恋人，我依旧记得我们走过的小道，路过了怎样的花草，交谈着想象的未来。是的，我爱她，她爱着我，沉默时我们也在交流，空气是我们的密语。她尝尝微笑着不说话，只是呆听着我说，我也爱讲给她听，这是“我们”的生活，没有太多私密空间，只有私密地接触，对的，我们相爱了。 </p>
<p> 但几年后某一天你突然对我说，你忘记了所有，我伤心极了，往事慢慢成碎片，而后又随风而去，这世上没有我们在一起的证据了，一张合影也没有。如果你要问我为什么没有，我说，是啊，因为我还不敢承认那“错误”的爱情啊，当我现在可以大声说爱你时，你却已经忘记所有，这就是你的背叛吗？我还在那个风口等着你，可你已经不会再来见我了，我知道的。 </p>
