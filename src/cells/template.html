<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080707">
  <title>cicada - Cells, motion and sound</title>
  <script>if (location.hash === "#cover") document.documentElement.classList.add("cells-cover-mode");</script>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #060605; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .experience { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#030303 23%, #120e0e 49%, #6e5351 77%, #bd9995 100%); }
    #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #scene:active { cursor: grabbing; }
    .chrome { position: fixed; z-index: 3; pointer-events: none; color: #d7d1ce; }
    .brand { top: max(28px, env(safe-area-inset-top)); left: max(34px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; color: #d7d1ce; text-decoration: none; opacity: .87; pointer-events: auto; transition: opacity .2s; }
    .brand:hover, .brand:focus-visible { opacity: 1; }
    .brand:focus-visible { outline: 1px solid #d7d1ce; outline-offset: 7px; }
    .brand-name { font: 32px/1 Georgia, "Times New Roman", serif; letter-spacing: 0; white-space: nowrap; }
    .brand-mark { display: block; width: 28px; height: 18px; margin-top: 4px; fill: currentColor; }
    .actions { top: max(24px, env(safe-area-inset-top)); right: max(28px, env(safe-area-inset-right)); display: flex; gap: 8px; }
    .transport { bottom: max(23px, env(safe-area-inset-bottom)); right: max(28px, env(safe-area-inset-right)); display: flex; gap: 8px; }
    .icon-button { pointer-events: auto; display: grid; place-items: center; width: 40px; height: 40px; padding: 10px; border: 1px solid transparent; border-radius: 50%; color: inherit; background: transparent; opacity: .63; cursor: pointer; transition: opacity .2s, background .2s, border-color .2s; }
    .icon-button:hover, .icon-button:focus-visible, .icon-button.is-demonstrating { opacity: 1; background: #ffffff12; border-color: #ffffff40; outline: none; }
    .icon-button svg { display: block; width: 18px; height: 18px; stroke-width: 1.25; }
    .icon-button[aria-pressed="true"] { opacity: .95; }
    .icon-button:disabled { opacity: .2; cursor: default; background: transparent; border-color: transparent; }
    .cell-count { bottom: max(23px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 40px 36px 40px; align-items: center; column-gap: 4px; padding: 2px; border: 1px solid #ffffff24; border-radius: 24px; background: #0c09094d; color: #f2e4df; pointer-events: auto; }
    .cell-count .icon-button { opacity: .9; }
    .cell-count .icon-button:disabled { opacity: .25; }
    .count-value { display: block; width: 36px; height: 40px; text-align: center; font-size: 12px; line-height: 40px; font-variant-numeric: tabular-nums; color: #f2e4df; opacity: .95; }
    .labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    .cell-label { position: absolute; left: 0; top: 0; font: 9px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; color: #dad2c7; opacity: 0; white-space: nowrap; will-change: transform; text-shadow: 0 0 5px #0005; }
    .caption { left: max(34px, env(safe-area-inset-left)); bottom: max(36px, env(safe-area-inset-bottom)); font-size: 16px; line-height: 1.5; color: #f1e3de; opacity: .55; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e5d5d0; font: 24px Georgia, serif; transition: opacity .7s; z-index: 5; background: #090808; pointer-events: none; }
    .loading.ready { opacity: 0; }
    .cells-cover-mode .chrome, .cells-cover-mode .loading { display: none; }
    @media (max-width: 600px) {
      .brand { left: 22px; top: max(26px, env(safe-area-inset-top)); }
      .brand-name { font-size: 24px; }
      .actions { right: 16px; top: max(21px, env(safe-area-inset-top)); gap: 2px; }
      .transport { right: 16px; bottom: max(21px, env(safe-area-inset-bottom)); gap: 2px; }
      .cell-count { bottom: max(21px, env(safe-area-inset-bottom)); grid-template-columns: 36px 28px 36px; column-gap: 2px; }
      .cell-count .icon-button { width: 36px; }
      .count-value { width: 28px; font-size: 11px; }
      .caption { left: 22px; bottom: max(84px, calc(env(safe-area-inset-bottom) + 64px)); max-width: calc(100% - 44px); font-size: 14px; }
      .cell-label { font-size: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .icon-button, .loading, .brand { transition: none; }
    }
    @media (max-width: 380px) { .brand-name { font-size: 21px; } }
    @media (max-width: 320px) {
      .brand { left: 14px; gap: 6px; }
      .brand-name { font-size: 18px; }
      .brand-mark { width: 24px; }
      .actions, .transport { right: 10px; }
      .actions .icon-button, .transport .icon-button { width: 32px; padding: 7px; }
      .caption { left: 14px; }
    }
  </style>
</head>
<body>
  <main class="experience" aria-label="cicada 三维细胞动态">
    <canvas id="scene" aria-label="可拖动旋转的三维细胞群"></canvas>
  </main>
  <a class="chrome brand" href="https://github.com/theageofadzz" target="_blank" rel="noopener noreferrer" aria-label="cicada@github" title="访问 GitHub 个人主页">
    <span class="brand-name">cicada@github</span>
    <svg class="brand-mark" viewBox="0 0 124 74" role="img" aria-label="intensea">
      <path d="M2 72A70 70 0 0 1 72 2H122V23A49 49 0 0 0 73 72H52A70 70 0 0 1 72 23A49 49 0 0 0 23 72Z"/>
      <path d="M101 51H122V72H101Z"/>
    </svg>
  </a>
  <div class="chrome actions">
    <button class="icon-button" id="sound" aria-label="开启声音" aria-pressed="false" title="开启声音"></button>
    <button class="icon-button" id="fullscreen" aria-label="全屏" title="全屏"></button>
  </div>
  <div class="chrome transport">
    <button class="icon-button" id="reset" aria-label="重置视角" title="重置视角"></button>
    <button class="icon-button" id="pause" aria-label="暂停动画" aria-pressed="false" title="暂停动画"></button>
  </div>
  <div class="chrome cell-count" role="group" aria-label="细胞数量">
    <button class="icon-button" id="remove-cell" aria-label="减少细胞" title="减少细胞"></button>
    <output class="count-value" id="cell-count" aria-label="细胞数量" aria-live="polite" aria-atomic="true">09</output>
    <button class="icon-button" id="add-cell" aria-label="增加细胞" title="增加细胞"></button>
  </div>
  <div class="chrome caption">Cells, motion and sound.</div>
  <div class="labels" aria-hidden="true"></div>
  <div class="loading">cicada</div>
  <script>/* APP_SCRIPT */</script>
</body>
</html>
